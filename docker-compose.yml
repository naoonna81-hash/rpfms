# RPFMS - top level docker-compose
# Runs the full stack: Postgres + backend API + frontend Next.js app.
# `docker compose up --build` then run migrate+seed once (see docs/DEPLOYMENT_GUIDE.md).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rpfms
      POSTGRES_PASSWORD: rpfms_dev_pw
      POSTGRES_DB: rpfms
    ports:
      - "5432:5432"
    volumes:
      - rpfms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpfms -d rpfms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rpfms:rpfms_dev_pw@postgres:5432/rpfms?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - rpfms_backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  rpfms_postgres_data:
  rpfms_backend_uploads:
